name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: tar.gz
          - goos: linux
            goarch: arm64
            ext: tar.gz
          - goos: darwin
            goarch: amd64
            ext: tar.gz
          - goos: darwin
            goarch: arm64
            ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          BIN="lskv"

          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w" -o "dist/${BIN}" .

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package

          BIN="lskv"

          cp "dist/${BIN}" package/
          cp README.md package/ 2>/dev/null || true

          ASSET="lskv_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.ext }}"

          if [[ "${{ matrix.ext }}" == "zip" ]]; then
            (cd package && zip -r "../dist/${ASSET}" .)
          else
            tar -C package -czf "dist/${ASSET}" .
          fi

          rm -rf package
          rm -f "dist/${BIN}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f \( -name "*.tar.gz" -o -name "*.zip" \) -print0 | sort -z | xargs -0 sha256sum > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
