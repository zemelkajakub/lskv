name: test-build

on:
  push:
    branches:
      - develop
      - feature/*
      - feature/**
      - fix/*
      - fix/**
  pull_request:
    branches:
      - develop
      - feature/*
      - feature/**
      - fix/*
      - fix/**
  workflow_dispatch:

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    name: fast checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(gofmt -l .)" ]]; then
            echo "Code is not gofmt-formatted"
            gofmt -l .
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  build:
    if: github.event_name != 'pull_request'
    name: full build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: pr-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          BIN="lskv"

          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w" -o "dist/${BIN}" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lskv-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
