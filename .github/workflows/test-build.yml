name: test-build

on:
  push:
    branches:
      - develop
      - feature/**
      - fix/**
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches:
      - develop
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    name: fast checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(gofmt -l .)" ]]; then
            echo "Code is not gofmt-formatted"
            gofmt -l .
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    name: full build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: pr-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION="dev-$(git rev-parse --short HEAD)"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          BIN="lskv"

          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w -X 'github.com/zemelkajakub/lskv/cmd/version.version=${{ steps.version.outputs.version }}'" -o "dist/${BIN}" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: lskv-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
